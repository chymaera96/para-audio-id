architecture: audio_lm_v1

tokenizer:
  model_name: OpenMuQ/MuQ-large-msd-iter
  revision: main
  sample_rate: 24000
  selected_codebooks: 2
  device: cuda

model:
  architecture: gpt2
  num_layers: 12
  hidden_size: 768
  num_attention_heads: 12
  max_position_embeddings: 512
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  attn_pdrop: 0.0
  tie_word_embeddings: true

data:
  audio_root: /gpfs/scratch/acw723/fma_data/fma_large
  catalogue: data/fma_large_100k.jsonl
  runtime_bad_files: data/runtime_bad_files.jsonl
  token_root: /gpfs/scratch/acw723/para-audio-id/audio_lm_tokens
  canonical_token_root: /gpfs/scratch/acw723/para-audio-id/audio_lm_tokens
  shifted_training_token_root: /gpfs/scratch/acw723/para-audio-id/audio_lm_tokens_shifted_training_10k
  heldout_evaluation_token_root: /gpfs/scratch/acw723/para-audio-id/audio_lm_tokens_heldout_evaluation_10k
  training_tracks_manifest: data/training_tracks_10k.json
  view_mode: paired
  segment_duration: 5.0
  segments_per_track: 6
  max_training_tracks: 10000
  canonical_starts: [0, 5, 10, 15, 20, 25]
  shifted_training_starts:
    [1, 2, 3, 4, 6, 7, 8, 9, 11, 12, 13, 14, 16, 17, 18, 19, 21, 22, 23, 24]
  shifted_evaluation_starts: [2.5, 7.5, 12.5, 17.5, 22.5]
  shard_documents: 10000
  extraction_batch_size: 32

train:
  seed: 1337
  deterministic: true
  deterministic_warn_only: true
  log_dir: logs/fma-large-audio-lm
  checkpoint_dir: /gpfs/scratch/acw723/para-audio-id/audio-lm-checkpoints
  run_id:
  max_steps: 100000
  tracks_per_microbatch: 4
  segments_per_track: 2
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 200
  evaluation_interval: 500
  id_digit_weight: 20.0
  gradient_clip_norm: 1.0
  wandb:
    enabled: false
    project: para-audio-id
    entity:
    name:
    mode: offline

evaluation:
  probe_tracks: 512
  probe_batch_size: 8
  generation_batch_size: 16
  beam_width: 10
  beam_every_n_steps: 2500
  shifted_starts: [2.5, 12.5, 22.5]

dataloader:
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 2

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  accumulate_grad_batches: 8
  log_every_n_steps: 25
