architecture: audio_lm_v1

tokenizer:
  model_name: OpenMuQ/MuQ-large-msd-iter
  revision: main
  sample_rate: 24000
  selected_codebooks: 2
  device: cuda

model:
  architecture: gpt2
  max_position_embeddings: 512
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  attn_pdrop: 0.0
  tie_word_embeddings: true

data:
  audio_root: /gpfs/scratch/acw723/fma_data/fma_large
  catalogue: data/fma_large_100k.jsonl
  database_size: 10000
  segment_duration: 2.0
  crop_retries: 4
  replacement_retries: 32

train:
  seed: 1337
  deterministic: true
  deterministic_warn_only: true
  log_dir: logs/fma-large-audio-lm
  checkpoint_dir: /gpfs/scratch/acw723/para-audio-id/audio-lm-checkpoints
  run_id:
  target_exposures: 560
  tracks_per_microbatch: 80
  segments_per_track: 2
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 200
  evaluation_interval: 2500
  checkpoint_interval: 500
  id_digit_weight: 8.0
  gradient_clip_norm: 1.0
  wandb:
    enabled: false
    project: para-audio-id
    entity:
    name:
    mode: offline

evaluation:
  online_monitor_enabled: true
  monitor_tracks: 100
  generation_batch_size: 16
  beam_width: 10

dataloader:
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 2

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  accumulate_grad_batches: 1
  log_every_n_steps: 25
