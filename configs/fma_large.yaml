architecture: audio_lm_v1

tokenizer:
  model_name: OpenMuQ/MuQ-large-msd-iter
  revision: main
  sample_rate: 24000
  selected_codebooks: 2
  device: cuda

model:
  architecture: gpt2
  num_layers: 12
  hidden_size: 768
  num_attention_heads: 12
  max_position_embeddings: 512
  resid_pdrop: 0.0
  embd_pdrop: 0.0
  attn_pdrop: 0.0
  tie_word_embeddings: true

data:
  audio_root: /gpfs/scratch/acw723/fma_data/fma_large
  catalogue: data/fma_large_100k.jsonl
  training_tracks_manifest: data/training_tracks_25k.json
  segment_duration: 2.0
  max_training_tracks: 25000
  crop_retries: 4
  replacement_retries: 32
  background_noise:
    training_root: /gpfs/scratch/acw723/audio-degradation-data/degradation_24k/bg_noise/train
    validation_root: /gpfs/scratch/acw723/audio-degradation-data/degradation_24k/bg_noise/test
  room_ir:
    training_root: /gpfs/scratch/acw723/audio-degradation-data/degradation_24k/room_ir/train
    validation_root: /gpfs/scratch/acw723/audio-degradation-data/degradation_24k/room_ir/test
    past_context_duration: 2.0

train:
  seed: 1337
  deterministic: true
  deterministic_warn_only: true
  log_dir: logs/fma-large-audio-lm
  checkpoint_dir: /gpfs/scratch/acw723/para-audio-id/audio-lm-checkpoints
  run_id:
  max_steps: 175000
  tracks_per_microbatch: 10
  segments_per_track: 2
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.0
  warmup_steps: 200
  evaluation_interval: 2500
  checkpoint_interval: 500
  id_digit_weight: 8.0
  gradient_clip_norm: 1.0
  schedule:
    protocol: online_random_crop_noise_rir_consistency_25k_v1
    loss_protocol: tc5_family_weighted_consistency_v2
    clean_until_step: 50000
    noise_ramp_until_step: 62500
    noise_steady_until_step: 87500
    rir_ramp_until_step: 100000
    combined_ramp_until_step: 112500
    consistency_weight: 0.10
    snr_bin_probabilities: [0.40, 0.30, 0.20, 0.10]
    exact_zero_fraction_in_first_bin: 0.25
  wandb:
    enabled: false
    project: para-audio-id
    entity:
    name:
    mode: offline

evaluation:
  online_monitor_enabled: true
  monitor_tracks: 100
  generation_batch_size: 16
  beam_width: 10
  noise_snr_db: [0, 5, 10, 20, 30]

dataloader:
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 2

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  accumulate_grad_batches: 8
  log_every_n_steps: 25
